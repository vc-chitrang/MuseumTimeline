name: CI/CD – Deploy Hello World

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── 1. Lint / Validate ───────────────────────────────────────────────────────
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate index.html
        run: html-validate index.html

  # ── 2. Deploy to GitHub Pages ────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate                  # only deploy when validation passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true   # auto-enables Pages if not already configured

      - name: Upload artifact (site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'           # deploy from the repo root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
